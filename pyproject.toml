[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track2-agent"
version = "1.0.0"
description = "Agenthon 2026 Track 2 submission: numeric + LLM-text reasoning forecaster."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "jsonschema>=4.21",
  # The shared toolkit owns all official scoring and admissibility math.  The local smoke
  # command imports qfbench2_track_forecasting, so this must be a declared installation-time
  # dependency rather than an accidental consequence of running tests from the repository root.
  "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.3.1#subdirectory=common",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["track2_agent", "qfbench2_track_forecasting"]

[tool.setuptools.package-dir]
track2_agent = "src/track2_agent"
qfbench2_track_forecasting = "qfbench2_track_forecasting"

[project.scripts]
forecast = "track2_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs Docker, a registry, a network or a sibling service; skipped in unit runs",
]
